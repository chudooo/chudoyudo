<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подарок</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .gift {
            font-size: 100px;
            cursor: pointer;
            transition: transform 0.1s ease;
            margin-bottom: 20px;
        }

        .gift:active {
            transform: scale(0.9);
        }

        .counter {
            font-size: 48px;
            font-weight: bold;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gift" id="gift">🎁</div>
        <div class="counter" id="counter">100</div>
    </div>

    <script>
        const TELEGRAM_LINK = const TELEGRAM_LINK = "tg://join?invite=A5_ZJ8Nds7YwYjJi";

        let clicksLeft = 100;
        const giftElement = document.getElementById("gift");
        const counterElement = document.getElementById("counter");

        giftElement.addEventListener("click", () => {
            if (clicksLeft > 0) {
                clicksLeft--;
                counterElement.textContent = clicksLeft;

                if (clicksLeft === 0) {
                    window.location.href = TELEGRAM_LINK;
                }
            }
        });
    </script>
</body>
</html>
